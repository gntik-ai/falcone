name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.0.0'
  # Publish this paired Keycloak public-path allowlist chart commit before source CI runs.
  FALCONE_CHARTS_REF: '5bd737aec8b490ae0cf77ad2a188c2d56fd77804'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Checkout deployment charts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: gntik-ai/falcone-charts
          ref: ${{ env.FALCONE_CHARTS_REF }}
          path: falcone-charts

      - name: Expose sibling charts checkout
        run: ln -sfn "$GITHUB_WORKSPACE/falcone-charts" "$GITHUB_WORKSPACE/../falcone-charts"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and repository validation
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Flow stream API-key log hygiene
        run: |
          node --test tests/blackbox/flow-stream-apikey-logs.test.mjs \
            tests/blackbox/flows-execution-events.test.mjs \
            tests/blackbox/executor-5xx-code-redaction.test.mjs

      - name: Flow execution-token trust
        run: |
          pnpm --filter @in-falcone/workflow-worker typecheck
          pnpm --filter @in-falcone/workflow-worker build
          node --test tests/blackbox/flows-execution-secret-production.test.mjs \
            tests/blackbox/flows-execution-token-trust.test.mjs \
            tests/blackbox/flows-execution-credentials.test.mjs \
            tests/blackbox/flows-activity-token-gate.test.mjs \
            tests/blackbox/flows-execution-token-not-in-memo.test.mjs \
            tests/blackbox/flows-activities.test.mjs \
            tests/blackbox/flows-worker-db-activity-wiring.test.mjs \
            tests/blackbox/llm-complete-activity.test.mjs

      - name: Worker and control-plane image contracts
        run: |
          node --test tests/blackbox/flows-worker-dockerfile.test.mjs \
            tests/blackbox/scheduling-handler-dockerfile.test.mjs \
            tests/blackbox/flows-worker-pg-env-and-search-attrs.test.mjs

      - name: Live catalog quota admission
        run: |
          node --test tests/blackbox/live-resource-quota-enforcement.test.mjs \
            tests/blackbox/live-storage-function-quotas.test.mjs \
            tests/blackbox/workspace-quota-enforcement.test.mjs \
            tests/blackbox/storage-quota-enforcement.test.mjs \
            tests/blackbox/storage-quota-handlers.test.mjs \
            tests/blackbox/storage-object-io-completeness.test.mjs

      - name: Storage workspace authorization and regression tests
        run: |
          node --test tests/blackbox/storage-workspace-authz.test.mjs \
            tests/blackbox/storage-workspace-bucket-list.test.mjs \
            tests/blackbox/structural-write-role-gates-kind.test.mjs \
            tests/blackbox/data-export-import-clone.test.mjs \
            tests/blackbox/storage-bucket-ownership-idor.test.mjs \
            tests/blackbox/storage-object-not-found-clean-error.test.mjs \
            tests/blackbox/storage-object-write-envelope.test.mjs \
            tests/blackbox/storage-per-bucket-credential-scope.test.mjs \
            tests/blackbox/storage-handlers-object-key-validation.test.mjs

      - name: Adapter integration scaffolding
        run: pnpm test:adapters

      - name: Contract tests
        run: pnpm test:contracts

      - name: Database gateway routes, kind chart parity, and role gates
        run: |
          helm version --short
          node --test tests/blackbox/mongo-gateway-route.test.mjs \
            tests/blackbox/postgres-gateway-route.test.mjs \
            tests/blackbox/structural-write-role-gates-executor.test.mjs

      - name: Authorization denial audit harness
        run: node --test tests/blackbox/authorization-denial-audit.test.mjs

      - name: Self-tenant plan history authorization and projection
        run: node --test tests/blackbox/self-tenant-plan-history.test.mjs

      - name: Workspace delete cascade
        run: node --test tests/blackbox/workspace-delete-cascade.test.mjs

      - name: Flows ADR and spike artifacts
        run: node --test tests/blackbox/flows-adr-spike-artifacts.test.mjs

      - name: Console E2E scaffolding
        run: pnpm test:e2e:console

      - name: Deployment smoke scaffolding
        run: pnpm test:e2e:deployment

      - name: Resilience scaffolding
        run: pnpm test:resilience

      - name: Workflow E2E tests
        run: |
          set -o pipefail
          mkdir -p test-results
          pnpm test:e2e:workflows 2>&1 | tee test-results/workflows-e2e.tap

      - name: Upload workflow E2E test artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workflows-e2e-test-results
          path: test-results/workflows-e2e.tap
          if-no-files-found: error

      - name: Restore E2E tests
        env:
          RESTORE_TEST_REPORT_OUTPUT: test-results/restore-e2e-report.json
        run: |
          set -o pipefail
          mkdir -p test-results
          pnpm test:e2e:restore 2>&1 | tee test-results/restore-e2e.tap

      - name: Upload restore E2E test artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: restore-e2e-test-results
          path: |
            test-results/restore-e2e.tap
            test-results/restore-e2e-report.json
          if-no-files-found: error

      # SeaweedFS migration validation (change add-seaweedfs-migration-validation).
      # Gated OFF by default (repo variable SEAWEEDFS_VALIDATION != '1') so normal CI
      # is unaffected; enable only when a SeaweedFS-backed env + Postgres are reachable
      # (operator supplies S3_ENDPOINT / creds / DATABASE_URL as repo vars/secrets).
      # Runs the parity checker + per-tenant storage smoke via the blackbox entrypoint.
      - name: SeaweedFS migration validation (gated)
        if: ${{ vars.SEAWEEDFS_VALIDATION == '1' }}
        env:
          SEAWEEDFS_VALIDATION: '1'
          S3_ENDPOINT: ${{ vars.SEAWEEDFS_S3_ENDPOINT }}
          S3_ACCESS_KEY: ${{ secrets.SEAWEEDFS_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.SEAWEEDFS_S3_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.SEAWEEDFS_VALIDATION_DATABASE_URL }}
          MIGRATION_MANIFEST: ${{ vars.SEAWEEDFS_MIGRATION_MANIFEST }}
        run: bash tests/blackbox/run.sh

      # FerretDB migration validation (change add-ferretdb-migration-validation).
      # Gated OFF by default (repo variable FERRETDB_VALIDATION != '1') so normal CI is
      # unaffected; enable only when a FerretDB v2 + DocumentDB endpoint is reachable
      # (operator supplies FERRETDB_URI + the migration manifest as repo vars/secrets).
      # Runs the document-parity checker + per-tenant data-API smoke (incl. ADR-14 risk-area
      # probes) via the blackbox entrypoint; FERRETDB_VALIDATION_NO_COMPOSE skips local compose
      # bring-up when the endpoint is an external service rather than tests/env docker-compose.
      - name: FerretDB migration validation (gated)
        if: ${{ vars.FERRETDB_VALIDATION == '1' }}
        env:
          FERRETDB_VALIDATION: '1'
          FERRETDB_VALIDATION_NO_COMPOSE: '1'
          FERRETDB_URI: ${{ secrets.FERRETDB_URI }}
          MIGRATION_MANIFEST: ${{ vars.FERRETDB_MIGRATION_MANIFEST }}
        run: bash tests/blackbox/run.sh

      - name: Plan Enforcement Coherence Tests (gated)
        if: ${{ vars.PLAN_ENFORCEMENT_VALIDATION == '1' }}
        run: node --test --test-reporter=tap tests/integration/plan-enforcement/suites/*.test.mjs
        env:
          PLAN_ENFORCEMENT_STRICT: 'true'
          GATEWAY_BASE_URL: ${{ secrets.GATEWAY_BASE_URL }}
          CONTROL_PLANE_URL: ${{ secrets.CONTROL_PLANE_URL }}
          CONSOLE_API_URL: ${{ secrets.CONSOLE_API_URL }}
          KEYCLOAK_URL: ${{ secrets.KEYCLOAK_URL }}
          KEYCLOAK_REALM: ${{ secrets.KEYCLOAK_REALM }}
          SUPERADMIN_CLIENT_ID: ${{ secrets.SUPERADMIN_CLIENT_ID }}
          SUPERADMIN_CLIENT_SECRET: ${{ secrets.SUPERADMIN_CLIENT_SECRET }}
          KAFKA_BROKERS: ${{ secrets.KAFKA_BROKERS }}
          KAFKA_AUDIT_TOPIC: ${{ secrets.KAFKA_AUDIT_TOPIC }}
          TEST_RESULT_OUTPUT_PATH: test-results/plan-enforcement-report.json

      - name: Upload plan enforcement test artifact
        if: ${{ always() && vars.PLAN_ENFORCEMENT_VALIDATION == '1' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plan-enforcement-tests-result
          path: test-results/plan-enforcement-report.json
          if-no-files-found: ignore

      - name: Plan Upgrade/Downgrade E2E Tests (gated)
        if: ${{ vars.PLAN_ENFORCEMENT_VALIDATION == '1' }}
        run: node --test --test-reporter=tap tests/e2e/101-plan-upgrade-downgrade-tests/index.test.mjs
        env:
          TEST_API_BASE_URL: ${{ secrets.TEST_API_BASE_URL }}
          TEST_SUPERADMIN_TOKEN: ${{ secrets.TEST_SUPERADMIN_TOKEN }}
          TEST_PG_DSN: ${{ secrets.TEST_PG_DSN }}
          KAFKA_ENABLED: 'true'
          KAFKA_BROKERS: ${{ secrets.KAFKA_BROKERS }}
          TEST_RESULT_OUTPUT_PATH: test-results/101-plan-upgrade-downgrade-tests-result.json

      - name: Upload plan upgrade/downgrade test artifact
        if: ${{ always() && vars.PLAN_ENFORCEMENT_VALIDATION == '1' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plan-upgrade-downgrade-tests-result
          path: test-results/101-plan-upgrade-downgrade-tests-result.json
          if-no-files-found: ignore

      - name: Upload control-plane contract artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: control-plane-openapi-contract
          path: apps/control-plane-executor/openapi/control-plane.openapi.json
          if-no-files-found: error

      - name: Upload deployment topology artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-topology-contract
          path: packages/internal-contracts/src/deployment-topology.json
          if-no-files-found: error

      - name: Upload domain model artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: domain-model-contract
          path: packages/internal-contracts/src/domain-model.json
          if-no-files-found: error

  http-idempotency:
    runs-on: ubuntu-latest
    env:
      HTTP_IDEMPOTENCY_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
      HTTP_IDEMPOTENCY_TEST_REQUIRED: '1'
    services:
      postgres:
        image: docker.io/library/postgres:17.2-alpine@sha256:7e5df973a74872482e320dcbdeb055e178d6f42de0558b083892c50cda833c96
        env:
          # Disposable CI database; no production credentials or data.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Real Postgres reservation, expiry and tenant purge
        run: node --test tests/integration/http-idempotency-postgres.test.mjs

      - name: Real Postgres workspace bucket pagination
        env:
          STORAGE_BUCKET_LIST_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
          STORAGE_BUCKET_LIST_TEST_REQUIRED: '1'
        run: node --test tests/integration/storage-workspace-bucket-page.test.mjs

      - name: HTTP flow creation and Kafka publish reproductions
        run: node --test tests/unit/http-idempotency-server.test.mjs

  web-console:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Console API unit tests (vitest)
        run: pnpm --filter @in-falcone/console-api test

      - name: Web console unit tests (vitest)
        run: pnpm --filter @in-falcone/web-console test

  web-console-next:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck the next console
        run: pnpm --filter @in-falcone/web-console-next typecheck

      - name: Test the next console
        run: pnpm --filter @in-falcone/web-console-next test

      - name: Enforce semantic colour tokens
        run: pnpm --filter @in-falcone/web-console-next lint:colours

      - name: Check translation resource parity
        run: pnpm --filter @in-falcone/web-console-next check:i18n

      - name: Enforce translated console copy
        run: pnpm --filter @in-falcone/web-console-next lint:i18n

      - name: Test translation validation fixtures
        run: pnpm --filter @in-falcone/web-console-next test:i18n

      - name: Validate exact public UI pins
        run: node scripts/validate-gntik-ui-pin.mjs

      - name: Test pin, colour and CI validation
        run: |
          node --test tests/unit/gntik-ui-pin.test.mjs
          node --test tests/unit/web-console-next-colours.test.mjs
          node --test tests/unit/web-console-next-ci.test.mjs

      - name: Build the next console at both base paths
        run: |
          for base in / /next/; do
            VITE_BASE_PATH="$base" pnpm --filter @in-falcone/web-console-next build
            pnpm --filter @in-falcone/web-console-next test:i18n-chunks
            BASE_PATH="$base" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const html = readFileSync('apps/web-console-next/dist/index.html', 'utf8');
          const assets = [...html.matchAll(/(?:src|href)="([^"]+)"/g)].map((match) => match[1]);
          assert.ok(assets.length > 0, 'Expected built asset URLs');
          assert.ok(assets.every((url) => url.startsWith(`${process.env.BASE_PATH}assets/`)));
          NODE
          done

      - name: Validate next-console CSP and self-hosted assets
        run: |
          pnpm --filter @in-falcone/web-console-next exec playwright install --with-deps chromium
          node --test apps/web-console-next/tests/validate-dist.test.mjs
          for base in / /next/; do
            CSP_TEST_HARNESS=true VITE_BASE_PATH="$base" pnpm --filter @in-falcone/web-console-next build
            pnpm --filter @in-falcone/web-console-next validate:dist
            VITE_BASE_PATH="$base" pnpm --filter @in-falcone/web-console-next test:csp
          done

      - name: Build the legacy release SPA
        run: pnpm --filter @in-falcone/web-console exec vite build

      - name: Build the next release SPA
        env:
          VITE_BASE_PATH: /next/
          CSP_TEST_HARNESS: ''
        run: pnpm --filter @in-falcone/web-console-next exec vite build

      - name: Build the legacy console image without publishing
        run: docker build -f apps/web-console/Dockerfile .

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Checkout deployment charts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: gntik-ai/falcone-charts
          ref: ${{ env.FALCONE_CHARTS_REF }}
          path: falcone-charts

      - name: Expose sibling charts checkout
        run: ln -sfn "$GITHUB_WORKSPACE/falcone-charts" "$GITHUB_WORKSPACE/../falcone-charts"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency vulnerability audit
        run: pnpm security:deps

      - name: Image supply-chain policy validation
        run: pnpm security:images

      - name: Third-party license report (SBOM)
        run: |
          mkdir -p sbom
          pnpm --silent sbom:licenses | tee sbom/third-party-licenses.txt
          pnpm --silent sbom:licenses:json > sbom/third-party-licenses.json

      - name: Upload third-party license report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: third-party-license-report
          path: sbom/
          if-no-files-found: error

  real-stack:
    # Boots the tests/env Postgres (pgvector image) and runs the control-plane
    # executor real-stack slice — incl. the vector-search cross-tenant KNN probe,
    # RLS, data/DDL/realtime executors — against a REAL database. These prove the
    # tenant-isolation guarantees that in-memory unit tests cannot.
    runs-on: ubuntu-latest
    # The tests/env compose stack uses a FIXED compose project name (falcone-testenv) and a
    # FIXED host port (55432). On a shared Docker host (self-hosted runners), two concurrent
    # real-stack runs collide ("address already in use" / container-name conflict, issue #413).
    # Serialize repo-wide so only one run touches the shared host at a time. GLOBAL group (not
    # per-branch): the Docker host is the shared resource. cancel-in-progress:false => queue, so
    # the running integration finishes and tears down cleanly rather than being killed mid-run.
    concurrency:
      group: real-stack-shared-host
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Defensive: clear any leftover stack from a hard-killed prior run (the trap-based
      # teardown can be skipped if a job is force-cancelled). Serialization (above) prevents
      # concurrent collisions; this handles residue. Safe no-op when nothing is running.
      - name: Pre-clean any leftover tests/env stack
        run: docker compose -f tests/env/docker-compose.yml down -v --remove-orphans || true

      - name: Executor real-stack tests (Postgres + pgvector)
        run: bash tests/env/executor/run.sh

      - name: Executor realtime SSE tests (DocumentDB + FerretDB)
        run: bash tests/env/executor/run-realtime.sh

      - name: Flow audit outbox real-stack tests (Postgres + Redpanda)
        run: bash tests/env/flow-audit-outbox/run.sh

      - name: Tear down compose
        if: always()
        run: docker compose -f tests/env/docker-compose.yml down -v
