name: release-images

# Build and publish the Falcone application container images to GHCR on strict vX.Y.Z tag pushes,
# published GitHub Releases, and explicit manual runs. Every build publishes both the version tag
# (for example 0.6.2) and an immutable sha-<commit> tag from github.sha; stable tag-triggered
# builds also publish :latest. Existing matching immutable references are verified and skipped to
# prevent a release or manual run from rebuilding or overwriting a previously published version.
#
# Images are pushed to ghcr.io/<owner>/<image> using the workflow's GITHUB_TOKEN — no PAT
# required. After a release, deploy by pinning each component image tag to the release version.
#
# IMPORTANT — which runtime each image builds (the proven, deployable runtimes):
#   in-falcone-control-plane           apps/control-plane/Dockerfile  (server.mjs: validates the
#                                       Keycloak JWT and dispatches /v1/* to the real action modules)
#   in-falcone-control-plane-executor  apps/control-plane-executor/Dockerfile         (main.mjs: the data-plane
#                                       executor that fronts the control-plane)
#   in-falcone-web-console             apps/web-console/Dockerfile (static-server, numeric UID,
#                                       zero-write — compatible with the restricted security profile)
#   in-falcone-fn-runtime              apps/fn-runtime/Dockerfile     (nodejs function runtime)
#   in-falcone-workflow-worker         apps/workflow-worker/Dockerfile   (Temporal DSL worker)
#   in-falcone-mcp-runtime             apps/mcp-runtime/Dockerfile           (first-party MCP JSON-RPC runtime)
on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to publish (e.g. 0.6.2 or v0.6.2). Used as the image tag.'
        required: true
      push_latest:
        description: 'Also tag/push :latest'
        type: boolean
        default: false
      publish_fn_runtime:
        description: 'Publish the function runtime image in this manual run'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.0.0'

concurrency:
  # Canonicalize manual X.Y.Z inputs to vX.Y.Z so they serialize with tag and release events.
  group: release-images-${{ github.event_name == 'workflow_dispatch' && (startsWith(inputs.tag, 'v') && inputs.tag || format('v{0}', inputs.tag)) || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: in-falcone-control-plane
            dockerfile: apps/control-plane/Dockerfile
          - image: in-falcone-control-plane-executor
            dockerfile: apps/control-plane-executor/Dockerfile
          - image: in-falcone-web-console
            dockerfile: apps/web-console/Dockerfile
            build_spa: 'true'
          - image: in-falcone-fn-runtime
            dockerfile: apps/fn-runtime/Dockerfile
          - image: in-falcone-workflow-worker
            dockerfile: apps/workflow-worker/Dockerfile
          - image: in-falcone-mcp-runtime
            dockerfile: apps/mcp-runtime/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Resolve and validate the release, pushed tag, or manual input without interpolating
      # untrusted tag values into this shell script. GHCR requires a lowercase namespace.
      - name: Resolve version and registry namespace
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUSH_LATEST: ${{ inputs.push_latest }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
          IMAGE: ${{ matrix.image }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            raw="$RELEASE_TAG"
            latest="true"
          elif [ "$EVENT_NAME" = "push" ]; then
            raw="$REF_NAME"
            latest="true"
          else
            raw="$INPUT_TAG"
            latest="$INPUT_PUSH_LATEST"
          fi
          if ! [[ "$raw" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must be strict vX.Y.Z or X.Y.Z, got invalid value"
            exit 1
          fi
          version="${raw#v}"
          short_sha="${SHA:0:7}"
          if ! [[ "$short_sha" =~ ^[0-9a-f]{7}$ ]]; then
            echo "::error::github.sha did not provide a valid short commit SHA"
            exit 1
          fi
          owner="$REPOSITORY_OWNER"
          owner_lc="$(echo "$owner" | tr '[:upper:]' '[:lower:]')"
          {
            echo "version=$version"
            echo "short_sha=$short_sha"
            echo "namespace=ghcr.io/${owner_lc}"
            echo "push_latest=$latest"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing $IMAGE:$version and sha-$short_sha to ghcr.io/${owner_lc}"

      # The web-console SPA is built here (vite) so the thin Node static-server release image
      # just copies the dist. Other images build straight from their Dockerfile (repo-root context).
      - name: Setup pnpm
        if: matrix.build_spa == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        if: matrix.build_spa == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        if: matrix.build_spa == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build web-console SPA (vite)
        if: matrix.build_spa == 'true'
        run: pnpm --filter @in-falcone/web-console exec vite build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          IMAGE: ${{ matrix.image }}
          NAMESPACE: ${{ steps.meta.outputs.namespace }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          PUSH_LATEST: ${{ steps.meta.outputs.push_latest }}
        run: |
          base="${NAMESPACE}/${IMAGE}"
          {
            echo "version_ref=${base}:${VERSION}"
            echo "sha_ref=${base}:sha-${SHORT_SHA}"
            echo 'value<<EOF'
            echo "${base}:${VERSION}"
            echo "${base}:sha-${SHORT_SHA}"
            if [ "$PUSH_LATEST" = "true" ]; then
              echo "${base}:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # Builds are idempotent only when both immutable references already point at the same
      # manifest. Fail closed on partial, conflicting, or uninspectable references.
      - name: Check existing immutable image tags
        id: existing
        if: github.event_name != 'workflow_dispatch' || matrix.image != 'in-falcone-fn-runtime' || inputs.publish_fn_runtime
        env:
          VERSION_REF: ${{ steps.tags.outputs.version_ref }}
          SHA_REF: ${{ steps.tags.outputs.sha_ref }}
          IMAGE: ${{ matrix.image }}
        run: |
          inspect_digest() {
            local result
            local stderr_file
            stderr_file="$(mktemp)"
            if result="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$1" 2>"$stderr_file")"; then
              rm -f "$stderr_file"
              printf '%s\n' "$result"
              return 0
            fi
            result="$(<"$stderr_file")"
            rm -f "$stderr_file"
            if printf '%s' "$result" | grep -Eqi '(not found|manifest unknown|name unknown)'; then
              return 1
            fi
            echo "::error::could not inspect $1: $result" >&2
            return 2
          }

          if version_digest="$(inspect_digest "$VERSION_REF")"; then
            version_status=0
          else
            version_status=$?
          fi
          if sha_digest="$(inspect_digest "$SHA_REF")"; then
            sha_status=0
          else
            sha_status=$?
          fi
          if [ "$version_status" -eq 2 ] || [ "$sha_status" -eq 2 ]; then exit 1; fi
          if [ "$version_status" -eq 1 ] && [ "$sha_status" -eq 1 ]; then
            echo 'skip=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$version_status" -ne 0 ] || [ "$sha_status" -ne 0 ]; then
            echo "::error::$IMAGE has only one existing immutable release tag; refusing to overwrite it"
            exit 1
          fi
          if [ "$version_digest" != "$sha_digest" ]; then
            echo "::error::$IMAGE version and sha tags resolve to different digests"
            exit 1
          fi
          echo 'skip=true' >> "$GITHUB_OUTPUT"
          {
            echo "### $IMAGE already published"
            echo
            echo "${VERSION_REF} and ${SHA_REF} both resolve to \`${version_digest}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push ${{ matrix.image }}
        id: build
        if: steps.existing.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || matrix.image != 'in-falcone-fn-runtime' || inputs.publish_fn_runtime)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.value }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

      - name: Verify published image digests
        if: steps.existing.outputs.skip != 'true' && steps.build.outcome == 'success'
        env:
          VERSION_REF: ${{ steps.tags.outputs.version_ref }}
          SHA_REF: ${{ steps.tags.outputs.sha_ref }}
          IMAGE: ${{ matrix.image }}
        run: |
          version_digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$VERSION_REF")"
          sha_digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$SHA_REF")"
          if [ "$version_digest" != "$sha_digest" ]; then
            echo "::error::$IMAGE version and sha tags resolve to different digests"
            exit 1
          fi
          {
            echo "### $IMAGE published"
            echo
            echo "${VERSION_REF} and ${SHA_REF} both resolve to \`${version_digest}\`."
          } >> "$GITHUB_STEP_SUMMARY"
