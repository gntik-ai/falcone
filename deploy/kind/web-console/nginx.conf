# Kind/local compatibility nginx config. It mirrors the console locations of apps/web-console/nginx.conf
# (the same redirect, traversal guard, /legacy refusal and /healthz) without the /v1 proxy.
server {
  listen 3000;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # Traversal guard, mirroring static-server.mjs: a "..", an encoded "..", a NUL or a backslash path segment
  # is a 400 before any redirect, file lookup or location dispatch. nginx matches locations on the decoded,
  # normalised URI, so "/next/../healthz" would otherwise land on "= /healthz": the RAW $request_uri is inspected
  # here, at server level, before a location is chosen. The 400 is served by an internal location that carries the
  # security headers. A genuine /v1 request (raw target and normalised URI both under /v1/) is exempt, so the API
  # edge stays unfiltered and undecorated, as in the Node server; a target that only normalises into /v1/ is not.
  set $bad_target 0;
  if ($request_uri ~* "^[^?]*(?:%00|(?:/|%2f|%5c|\x5c)(?:\.|%2e){2}(?:/|%2f|%5c|\x5c|\?|$))") {
    set $bad_target 1;
  }
  set $v1_pair "";
  if ($request_uri ~ "^/v1/") { set $v1_pair "raw"; }
  if ($uri ~ "^/v1/") { set $v1_pair "$v1_pair+normalised"; }
  if ($v1_pair = "raw+normalised") { set $bad_target 0; }
  if ($uri = /__bad_target) { set $bad_target 0; }
  if ($bad_target) { rewrite ^ /__bad_target last; }

  location = /__bad_target {
    internal;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; worker-src 'self' blob:; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    default_type text/plain;
    return 400 "Bad request";
  }

  # The former /next prefix: permanent redirect to the same path at the root. The target is built from the RAW
  # $request_uri (never the decoded $uri), so %2F, %23, %3F and %25 stay byte for byte, and the Location is
  # relative (absolute_redirect off): no scheme, host or port. A percent-encoded unreserved prefix such as
  # /%6Eext is /next (RFC 3986 section 6.2.2.2). Security headers sit on this location only, never at server
  # level, so that proxied /v1/ responses stay undecorated.
  location ~ "^/next(?:/|$)" {
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; worker-src 'self' blob:; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    absolute_redirect off;
    # "!" is an invalid remainder: a raw target that does not start with the prefix (for example //next/a,
    # which nginx merges into /next/a) is a 404, not a redirect.
    set $next_rest "!";
    if ($request_uri ~ "^/(?:n|%6[Ee])(?:e|%65)(?:x|%78)(?:t|%74)(.*)$") { set $next_rest $1; }
    if ($next_rest !~ "^(?:/|\?|$)") { return 404; }
    # A second slash or a backslash after the prefix would make the Location scheme-relative (open redirect).
    if ($next_rest ~ "^/[/\x5c]") { return 400; }
    set $next_location $next_rest;
    if ($next_rest ~ "^(?:\?.*)?$") { set $next_location /$next_rest; }
    return 301 $next_location;
  }

  # Nothing serves a /legacy path: the legacy bundle is not in the image.
  location ~ "^/legacy(?:/|$)" {
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; worker-src 'self' blob:; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    return 404;
  }

  location = /index.html {
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; worker-src 'self' blob:; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cache-Control 'no-store';
    try_files $uri =404;
  }

  location /assets/ {
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; worker-src 'self' blob:; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cache-Control 'public, max-age=31536000, immutable';
    try_files $uri =404;
  }

  # Readiness/liveness probe. Declared before "location /" so it never falls through to the SPA.
  location = /healthz {
    default_type text/plain;
    return 200 "ok";
  }

  location / {
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; worker-src 'self' blob:; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    try_files $uri $uri/ /index.html;
  }
}
