# Disposable single-node CI scheduling profile. The shared kind profile requests
# 4.25 CPU cores and 8320 MiB for steady workloads, before Kubernetes and Jobs.
# Keep every workload, replica, security setting and resource limit; reserve less
# for this short integration run so bootstrap Jobs can schedule on small runners.
apisix:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
controlPlane:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
controlPlaneExecutor:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
