openapi: 3.0.3
info:
  title: Secret Inventory API
  version: 1.0.0
paths:
  /v1/secrets/inventory:
    get:
      operationId: listSecretInventory
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: domain
          required: true
          schema:
            type: string
            enum: [platform, tenant, functions, gateway, iam]
        - in: query
          name: tenantId
          schema:
            type: string
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Secret inventory metadata response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [secrets, offset, limit]
                properties:
                  offset: { type: integer, minimum: 0 }
                  limit: { type: integer, minimum: 1, maximum: 200 }
                  secrets:
                    type: array
                    items:
                      $ref: '#/components/schemas/SecretMetadataItem'
        '400':
          description: Missing or invalid domain or invalid pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretInventoryError'
        '401':
          description: No authenticated identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretInventoryUnauthenticated'
        '403':
          description: Forbidden role, domain or tenant scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretInventoryError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    SecretInventoryError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: ['domain is required', 'invalid domain', 'invalid pagination', 'forbidden']
    SecretInventoryUnauthenticated:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, enum: [UNAUTHENTICATED] }
    SecretMetadataItem:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        domain: { type: string }
        path: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        status: { type: string }
        secretType: { type: string }
        tenantId: { type: string, format: uuid, nullable: true }
        currentVersion:
          type: object
          nullable: true
          additionalProperties: false
          required: [vaultVersion, state, activatedAt]
          properties:
            vaultVersion: { type: integer, minimum: 1 }
            state: { type: string, enum: [active, grace] }
            activatedAt: { type: string, format: date-time }
        requiresForce:
          type: boolean
          description: True only when the current version is the sole active or grace version
      not:
        anyOf:
          - required: [value]
          - required: [data]
