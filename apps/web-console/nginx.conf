# Console SPA server + same-origin API edge (fix-console-edge-routing, #505).
#
# The bundle served at / is the web-console-next build (basename /). The SPA issues same-origin /v1/* API
# calls (relative URLs). Without an edge, nginx's SPA catch-all rewrote /v1/* to index.html, so the browser got
# HTML for every API call. We add a /v1/ location that proxies to the gateway (APISIX), which
# validates the JWT and forwards to the control-plane — so the console talks to the backend in the
# deployed topology without CORS or hardcoded API hostnames.
#
# Rendered by the nginx image's envsubst from /etc/nginx/templates/default.conf.template:
# ${GATEWAY_UPSTREAM} is the gateway service (default falcone-apisix:9080; the chart overrides it
# when the release name differs). nginx's own $variables are left untouched (envsubst only
# substitutes variables present in the environment).
server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # Traversal guard, mirroring static-server.mjs: a "..", an encoded "..", a NUL or a backslash path segment
  # is a 400 before any redirect or file lookup. nginx matches locations on the decoded, normalised URI, so the
  # raw $request_uri is inspected here. The flag is only evaluated inside the console locations: /v1/ is not
  # decorated or filtered, as in the Node server.
  set $bad_target 0;
  if ($request_uri ~* "^[^?]*(?:%00|(?:/|%2f|%5c|\x5c)(?:\.|%2e){2}(?:/|%2f|%5c|\x5c|\?|$))") {
    set $bad_target 1;
  }

  # Same-origin API edge: proxy /v1/* to the gateway (APISIX → control-plane). MUST precede the
  # SPA catch-all; the longer /v1/ prefix wins over / for these requests.
  location /v1/ {
    proxy_pass http://${GATEWAY_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # The former /next prefix: permanent redirect to the same path at the root. The target is built from the RAW
  # $request_uri (never the decoded $uri), so %2F, %23, %3F and %25 stay byte for byte, and the Location is
  # relative (absolute_redirect off): no scheme, host or port. A percent-encoded unreserved prefix such as
  # /%6Eext is /next (RFC 3986 section 6.2.2.2). Security headers sit on this location only, never at server
  # level, so that proxied /v1/ responses stay undecorated.
  location ~ "^/next(?:/|$)" {
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; worker-src 'self' blob:; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    if ($bad_target) { return 400; }
    absolute_redirect off;
    # "!" is an invalid remainder: a raw target that does not start with the prefix (for example //next/a,
    # which nginx merges into /next/a) is a 404, not a redirect.
    set $next_rest "!";
    if ($request_uri ~ "^/(?:n|%6[Ee])(?:e|%65)(?:x|%78)(?:t|%74)(.*)$") { set $next_rest $1; }
    if ($next_rest !~ "^(?:/|\?|$)") { return 404; }
    # A second slash or a backslash after the prefix would make the Location scheme-relative (open redirect).
    if ($next_rest ~ "^/[/\x5c]") { return 400; }
    set $next_location $next_rest;
    if ($next_rest ~ "^(?:\?.*)?$") { set $next_location /$next_rest; }
    return 301 $next_location;
  }

  # Nothing serves a /legacy path: the legacy bundle is not in the image.
  location ~ "^/legacy(?:/|$)" {
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; worker-src 'self' blob:; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    return 404;
  }

  location = /index.html {
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; worker-src 'self' blob:; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    if ($bad_target) { return 400; }
    add_header Cache-Control 'no-store';
    try_files $uri =404;
  }

  location /assets/ {
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; worker-src 'self' blob:; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    if ($bad_target) { return 400; }
    add_header Cache-Control 'public, max-age=31536000, immutable';
    try_files $uri =404;
  }

  # Readiness/liveness probe. Declared before "location /" so it never falls through to the SPA.
  location = /healthz {
    default_type text/plain;
    return 200 "ok";
  }

  location / {
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; worker-src 'self' blob:; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    if ($bad_target) { return 400; }
    try_files $uri $uri/ /index.html;
  }
}
