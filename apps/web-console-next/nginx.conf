# Console SPA server + same-origin API edge (fix-console-edge-routing, #505).
#
# The SPA issues same-origin /v1/* API calls (apps/web-console-next/src/lib/http.ts uses relative
# URLs). Without an edge, nginx's SPA catch-all rewrote /v1/* to index.html, so the browser got
# HTML for every API call. We add a /v1/ location that proxies to the gateway (APISIX), which
# validates the JWT and forwards to the control-plane — so the console talks to the backend in the
# deployed topology without CORS or hardcoded API hostnames.
#
# Rendered by the nginx image's envsubst from /etc/nginx/templates/default.conf.template:
# ${GATEWAY_UPSTREAM} is the gateway service (default falcone-apisix:9080; the chart overrides it
# when the release name differs). nginx's own $variables are left untouched (envsubst only
# substitutes variables present in the environment).

# The retired /next prefix. nginx selects locations on the decoded, normalised $uri, which would turn /next/a%2Fb into
# /next/a/b and let /next/../x escape the prefix; so the redirect is classified from the raw $request_uri instead and
# the Location is copied from it byte for byte (never decoded, never re-escaped). The first matching rule wins:
#   "!"  unsafe target (non-printable byte, leading "/" or backslash after /next/, any backslash, or a ".." segment,
#        each also in percent-encoded form) -> 400
#   "/..." the relative Location, the raw suffix and raw query without the /next prefix
#   ""   not a /next target
# The prefix tolerates percent-encoded unreserved letters (/%6Eext), RFC 3986 section 6.2.2.2.
map $request_uri $web_console_next_target {
  default "";
  "~^/(?:n|%6[eE])(?:e|%65)(?:x|%78)(?:t|%74)(?:[/?]|$).*[^\x21-\x7e]" "!";
  "~^/(?:n|%6[eE])(?:e|%65)(?:x|%78)(?:t|%74)/(?:/|\x5c|%2[fF]|%5[cC])" "!";
  "~^/(?:n|%6[eE])(?:e|%65)(?:x|%78)(?:t|%74)/[^?]*(?:\x5c|%5[cC])" "!";
  "~^/(?:n|%6[eE])(?:e|%65)(?:x|%78)(?:t|%74)/(?:[^?]*(?:/|%2[fF]))?(?:\.|%2[eE]){2}(?:[/?]|%2[fF]|$)" "!";
  "~^/(?:n|%6[eE])(?:e|%65)(?:x|%78)(?:t|%74)(?<nquery>\?.*)?$" "/$nquery";
  "~^/(?:n|%6[eE])(?:e|%65)(?:x|%78)(?:t|%74)(?<nrest>/[^?]*)(?<nquery>\?.*)?$" "$nrest$nquery";
}

server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # Answered by @web_console_next_redirect, before any location is selected. No header is added at server level, so
  # proxied /v1/ responses stay undecorated.
  error_page 418 = @web_console_next_redirect;
  if ($web_console_next_target != "") {
    return 418;
  }

  # Same-origin API edge: proxy /v1/* to the gateway (APISIX → control-plane). MUST precede the
  # SPA catch-all; the longer /v1/ prefix wins over / for these requests.
  location /v1/ {
    proxy_pass http://${GATEWAY_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location @web_console_next_redirect {
    absolute_redirect off;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; worker-src 'self' blob:; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    if ($web_console_next_target = "!") {
      return 400;
    }
    return 301 $web_console_next_target;
  }

  # The legacy console is gone: no /legacy path answers 200, not even through the SPA fallback.
  location ~ ^/legacy(?:/|$) {
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; worker-src 'self' blob:; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    return 404;
  }

  location = /index.html {
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; worker-src 'self' blob:; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cache-Control 'no-store';
    try_files $uri =404;
  }

  location /assets/ {
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; worker-src 'self' blob:; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cache-Control 'public, max-age=31536000, immutable';
    try_files $uri =404;
  }

  location = /healthz {
    default_type text/plain;
    return 200 "ok";
  }

  location / {
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; worker-src 'self' blob:; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    try_files $uri $uri/ /index.html;
  }
}
